name: Android build and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build signed release artifacts using the production environment
        type: boolean
        default: false
      draft_release:
        description: Also create a draft GitHub release (never publishes to Play)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/android-setup
      - name: Validate Firebase package and Google sign-in configuration
        run: node tools/Validate-FirebaseConfig.cjs
      - name: Test and lint
        run: |
          node tools/Test-FirebaseConfig.cjs
          node tools/Test-SmsFeatures.cjs
          node tools/Test-SmsPaging.cjs
          ./gradlew :core:test :watch-protocol:test :app:lintDebug :app:lintRelease :wear:lintDebug --no-daemon --max-workers=1
      - name: Build debug APKs and unsigned production APK and AAB
        run: ./gradlew :app:assembleDebug :wear:assembleDebug :app:assembleRelease :app:bundleRelease --no-daemon --max-workers=1
      - name: Check packaged Firebase resources
        shell: pwsh
        run: |
          $aapt = "$env:ANDROID_HOME/build-tools/36.0.0/aapt2"
          ./tools/Test-FirebaseApk.ps1 -ApkPath app/build/outputs/apk/debug/app-debug.apk -Aapt2Path $aapt
          ./tools/Test-FirebaseApk.ps1 -ApkPath app/build/outputs/apk/release/app-release-unsigned.apk -Aapt2Path $aapt
      - name: Collect artifacts and checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/sandesh-phone-debug.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk dist/sandesh-watch-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/sandesh-phone-release-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/sandesh-phone-release-unsigned.aab
          git rev-parse HEAD > dist/COMMIT.txt
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sandesh-build-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Save test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports-${{ github.run_number }}
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.signed_release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/android-setup
      - name: Prepare owner signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SANDESH_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SANDESH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SANDESH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SANDESH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing signing secret: $name"; exit 1; fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sandesh-release.jks"
      - name: Build signed phone APK/AAB and legacy watch APK
        env:
          SANDESH_KEYSTORE_FILE: ${{ runner.temp }}/sandesh-release.jks
          SANDESH_KEYSTORE_PASSWORD: ${{ secrets.SANDESH_KEYSTORE_PASSWORD }}
          SANDESH_KEY_ALIAS: ${{ secrets.SANDESH_KEY_ALIAS }}
          SANDESH_KEY_PASSWORD: ${{ secrets.SANDESH_KEY_PASSWORD }}
        run: |
          node tools/Validate-FirebaseConfig.cjs
          ./gradlew :app:assembleRelease :app:bundleRelease :wear:assembleRelease :wear:lintRelease --no-daemon --max-workers=1
      - name: Verify signatures and collect release files
        env:
          EXPECTED_CERT: ${{ secrets.SANDESH_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_CERT" || { echo '::error::Missing SANDESH_SIGNING_CERT_SHA256'; exit 1; }
          mkdir -p release-dist
          cp app/build/outputs/apk/release/app-release.apk release-dist/sandesh-phone-release.apk
          cp wear/build/outputs/apk/release/wear-release.apk release-dist/sandesh-watch-release.apk
          cp app/build/outputs/bundle/release/app-release.aab release-dist/sandesh-phone-release.aab
          for apk in release-dist/*.apk; do
            actual=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            test "$(echo "$actual" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')" = "$(echo "$EXPECTED_CERT" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')" || { echo '::error::Signing certificate mismatch'; exit 1; }
          done
          jarsigner -verify release-dist/sandesh-phone-release.aab
          keytool -printcert -jarfile release-dist/sandesh-phone-release.aab > "$RUNNER_TEMP/aab-cert.txt"
          actual=$(sed -n 's/.*SHA256: //p' "$RUNNER_TEMP/aab-cert.txt" | head -1)
          test -n "$actual"
          test "$(echo "$actual" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')" = "$(echo "$EXPECTED_CERT" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          git rev-parse HEAD > release-dist/COMMIT.txt
          (cd release-dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - name: Check optimized Firebase resources
        shell: pwsh
        run: ./tools/Test-FirebaseApk.ps1 -ApkPath release-dist/sandesh-phone-release.apk -Aapt2Path "$env:ANDROID_HOME/build-tools/36.0.0/aapt2"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sandesh-signed-release-${{ github.run_number }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 30
      - name: Create reviewable draft release
        if: inputs.draft_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" release-dist/* --target "$GITHUB_SHA" --draft --title "Sandesh release candidate ${GITHUB_RUN_NUMBER}" --notes 'Signed release candidate. Complete the release checklist and physical-device tests before publication. The AAB is for Play upload; the local APK may use the upload certificate rather than the Play app-signing certificate.'
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/sandesh-release.jks" "$RUNNER_TEMP/aab-cert.txt"
